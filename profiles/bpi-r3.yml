description: Banana Pi R3 (MediaTek MT7986A) with prplOS (public feeds)
target: mediatek
subtarget: filogic
external_target: False

profiles:
  - bpi-r3
# feeds:
  # - name: feed_mediatek
  #   uri: https://gitlab.com/prpl-foundation/prplos/feeds/feed-mediatek
  #   revision: main@3b9dd8fe98707217963f3202c6b39777309dcdfe
packages:
  # Basic system packages
  - base-files
  - busybox
  - dropbear
  - firewall4
  - kmod-usb-storage
  - kmod-fs-ext4
  - kmod-fs-vfat
  - block-mount

  # MediaTek/BPI-R3 specific
  - uboot-envtools
  - kmod-mt7986-firmware
  - kmod-mt7915e
  - kmod-phy-aquantia

  # Network tools
  - iperf3
  - ethtool
  - tcpdump
 
  # Network tools
  - libudebug
diffconfig: |
  CONFIG_TARGET_mediatek=y
  CONFIG_TARGET_mediatek_filogic=y
  CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r3=y



  # SD card boot support
  # CONFIG_BANANAPI_BPI_R3_SDCARD=y

  # ===========
  CONFIG_PACKAGE_kmod-fs-overlayfs=y
  CONFIG_PACKAGE_kmod-fs-squashfs=y
  CONFIG_PACKAGE_kmod-fs-squashfs-builtin=y
  CONFIG_TARGET_ROOTFS_SQUASHFS=y
  CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=256
  # ===========
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_BLOCKSIZE=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_GET=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_PUT=y
  CONFIG_BUSYBOX_CONFIG_BASE64=y
  CONFIG_BUSYBOX_CONFIG_ARPING=y
  # ===========
  CONFIG_LIBC_USE_MUSL=y
  CONFIG_USE_MUSL=y
  CONFIG_LIBC="musl"
  CONFIG_TARGET_SUFFIX="musl"
  # ===========



  
  # USB support
  CONFIG_PACKAGE_kmod-usb2=y
  CONFIG_PACKAGE_kmod-usb3=y
  CONFIG_PACKAGE_kmod-usb-storage=y
  CONFIG_PACKAGE_kmod-fs-ext4=y
  CONFIG_PACKAGE_kmod-fs-vfat=y
  CONFIG_PACKAGE_block-mount=y

  # Network features
  CONFIG_PACKAGE_firewall4=y
  # CONFIG_PACKAGE_dnsmasq is not set
  # CONFIG_PACKAGE_kmod-input-gpio-keys is not set
  
  # WiFi support
  CONFIG_PACKAGE_kmod-mt7915e=y
  CONFIG_PACKAGE_kmod-mt7986-firmware=y
  CONFIG_PACKAGE_hostapd-common=y
  CONFIG_PACKAGE_hostapd-utils=y
  CONFIG_PACKAGE_wpad-basic-mbedtls=y
  CONFIG_PACKAGE_libudebug=y
  CONFIG_PACKAGE_udebug=y
  CONFIG_PACKAGE_libubox=y
  # Ethernet
  CONFIG_PACKAGE_kmod-phy-aquantia=y

  # prplOS branding
  CONFIG_VERSION_DIST="prplOS"
  CONFIG_VERSION_MANUFACTURER="prpl Foundation"
  CONFIG_VERSION_HOME_URL="https://prplfoundation.org"