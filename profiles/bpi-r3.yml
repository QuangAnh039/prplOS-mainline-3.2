description: Banana Pi R3 (MediaTek MT7986A) with prplOS (public feeds)
target: mediatek
subtarget: filogic
external_target: False

feeds:
  - name: feed_john
    uri: https://github.com/QuangAnh039/feed_john
    revision: main@3d412c2a5a9fdd0aec59e55db7cedfb9c7b574b6

profiles:
  - bpi-r3

packages:
  # SSH
  - dropbear

  # USB storage
  - kmod-usb-storage
  - kmod-fs-ext4
  - kmod-fs-vfat
  - block-mount


diffconfig: |
  CONFIG_TARGET_mediatek=y
  CONFIG_TARGET_mediatek_filogic=y
  CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r3=y

  # Image format - SD card boot
  # CONFIG_TARGET_ROOTFS_PARTSIZE=512
  # CONFIG_TARGET_KERNEL_PARTSIZE=64

  CONFIG_PACKAGE_kmod-fs-squashfs=y
  CONFIG_PACKAGE_kmod-fs-squashfs-builtin=y
  CONFIG_TARGET_ROOTFS_SQUASHFS=y
  # CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=256

  # CONFIG_PACKAGE_dnsmasq is not set
  
  # WiFi userspace
  # CONFIG_PACKAGE_hostapd-common=y
  # CONFIG_PACKAGE_hostapd-utils=y

  # CONFIG_PACKAGE_obuspa is not set
